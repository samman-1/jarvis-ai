<style>
  :root{
    --void:#050404; --ink:#0b0806;
    --line:rgba(255,255,255,.08); --glass:rgba(28,20,15,.55);
    --orange:#FF6A00; --orange-lt:#FF8A3D; --ember:#ff7a2e;
    --white:#ffffff; --body:#E7E1D8; --muted:#95897c; --green:#22C55E;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--void); color:var(--body);
    font-family:'Space Grotesk', system-ui, -apple-system, sans-serif;
    min-height:100dvh; -webkit-font-smoothing:antialiased; overflow-x:hidden;
    display:flex; align-items:center; justify-content:center; padding:40px 22px;
    position:relative;
  }
  /* ambient layers */
  #field{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  .glow{ position:fixed; z-index:0; pointer-events:none; border-radius:50%; filter:blur(70px); opacity:.55; }
  .glow.a{ width:520px; height:520px; top:-140px; left:50%; transform:translateX(-50%);
           background:radial-gradient(circle, rgba(255,106,0,.42), transparent 70%); animation:breathe 9s ease-in-out infinite; }
  .glow.b{ width:360px; height:360px; bottom:-120px; right:-80px;
           background:radial-gradient(circle, rgba(255,90,20,.22), transparent 70%); animation:breathe 11s ease-in-out infinite reverse; }
  .grid{ position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5;
         background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
         background-size:46px 46px; mask-image:radial-gradient(circle at 50% 40%, #000 30%, transparent 78%); -webkit-mask-image:radial-gradient(circle at 50% 40%, #000 30%, transparent 78%); }

  .wrap{ position:relative; z-index:1; width:100%; max-width:440px; text-align:center; }

  .logo{ width:96px; height:96px; margin:0 auto; display:block;
         animation:bloom 1.1s cubic-bezier(.2,.8,.2,1) both, pulse 4s ease-in-out 1.1s infinite; }
  .eyebrow{ margin-top:22px; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.34em;
            text-transform:uppercase; color:var(--orange); display:inline-flex; align-items:center; gap:9px; }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 9px var(--green); animation:blink 2s ease-in-out infinite; }
  h1{ margin-top:16px; font-size:clamp(40px,13vw,52px); font-weight:700; letter-spacing:-.03em; color:var(--white); line-height:1; }
  .lede{ margin-top:18px; font-size:15px; line-height:1.55; color:var(--body); max-width:32ch; margin-inline:auto; }
  .lede .ar{ font-family:'IBM Plex Sans Arabic',sans-serif; direction:rtl; color:var(--muted); display:block; margin-top:6px; font-size:14.5px; }
  .lede b{ color:var(--white); font-weight:600; }

  .pick{ margin-top:30px; font-family:'JetBrains Mono',monospace; font-size:10.5px; letter-spacing:.22em;
         text-transform:uppercase; color:var(--muted); display:flex; align-items:center; gap:12px; }
  .pick::before,.pick::after{ content:""; flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--line),transparent); }
  .pick .ar{ font-family:'IBM Plex Sans Arabic',sans-serif; }

  .opts{ margin-top:18px; display:flex; flex-direction:column; gap:14px; }
  .opt{
    position:relative; width:100%; display:flex; align-items:center; gap:16px; text-align:left; text-decoration:none;
    background:var(--glass); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line); border-radius:18px; padding:18px 20px; color:var(--white); overflow:hidden;
    transition:border-color .22s ease, transform .12s ease, box-shadow .22s ease;
  }
  .opt::before{ content:""; position:absolute; inset:0 0 auto 0; height:1px;
                background:linear-gradient(90deg,transparent,var(--orange),transparent); opacity:.7; }
  .opt:hover,.opt:focus-visible{ border-color:rgba(255,106,0,.6); box-shadow:0 14px 40px -18px rgba(255,106,0,.55); outline:none; }
  .opt:active{ transform:scale(.985); }
  .opt.ar-opt{ flex-direction:row-reverse; text-align:right; }
  .flag{ flex:0 0 48px; width:48px; height:48px; border-radius:13px; display:grid; place-items:center;
         background:linear-gradient(150deg,var(--orange-lt),var(--orange)); color:#1a0a01; box-shadow:0 6px 18px -6px rgba(255,106,0,.7);
         font-family:'JetBrains Mono',monospace; font-weight:600; font-size:16px; }
  .opt.ar-opt .flag{ font-family:'IBM Plex Sans Arabic',sans-serif; font-size:20px; }
  .txt{ flex:1; }
  .name{ display:block; font-size:20px; font-weight:600; line-height:1.15; }
  .name.ar{ font-family:'IBM Plex Sans Arabic',sans-serif; }
  .meta{ display:block; font-size:12.5px; color:var(--muted); margin-top:4px; }
  .meta.ar{ font-family:'IBM Plex Sans Arabic',sans-serif; }
  .arrow{ flex:0 0 auto; color:var(--orange); font-size:20px; transition:transform .22s ease; }
  .opt:hover .arrow{ transform:translateX(3px); }
  .opt.ar-opt:hover .arrow{ transform:translateX(-3px); }

  .foot{ margin-top:30px; font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.18em;
         text-transform:uppercase; color:#6b6157; }

  /* staggered entrance - starts visible after a short beat, ends at rest */
  .rise{ opacity:0; animation:rise .85s cubic-bezier(.22,1,.36,1) forwards; animation-delay:var(--d,0s); }

  @keyframes bloom{ from{ opacity:0; transform:scale(.86); filter:drop-shadow(0 0 0 rgba(255,106,0,0)); }
                    to{ opacity:1; transform:scale(1); filter:drop-shadow(0 0 22px rgba(255,106,0,.45)); } }
  @keyframes pulse{ 0%,100%{ filter:drop-shadow(0 0 12px rgba(255,106,0,.35)); }
                    50%{ filter:drop-shadow(0 0 26px rgba(255,120,40,.6)); } }
  @keyframes breathe{ 0%,100%{ opacity:.42; transform:translateX(-50%) scale(1); } 50%{ opacity:.62; transform:translateX(-50%) scale(1.08); } }
  @keyframes blink{ 0%,100%{ opacity:1; } 50%{ opacity:.4; } }
  @keyframes rise{ from{ opacity:0; transform:translateY(18px); } to{ opacity:1; transform:translateY(0); } }

  @media (prefers-reduced-motion: reduce){
    .logo,.dot,.glow{ animation:none !important; }
    .logo{ filter:drop-shadow(0 0 18px rgba(255,106,0,.4)); }
    .rise{ opacity:1; animation:none; }
    .opt,.arrow{ transition:none; }
  }
</style>

<script>
  // Ambient orange constellation - light enough for phones/iPads. Static single frame if reduced-motion.
  const cv = document.getElementById('field'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, DPR, pts, raf;
  function init(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const n = Math.max(22, Math.min(58, Math.round((W * H) / 24000)));
    pts = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .22, vy: (Math.random() - .5) * .22,
      r: Math.random() * 1.5 + .5,
    }));
  }
  function draw(){
    ctx.clearRect(0, 0, W, H);
    for (const p of pts){ p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1; }
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++){
      const a = pts[i], b = pts[j], dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy);
      if (d < 120){ ctx.strokeStyle = 'rgba(255,106,0,' + (0.09 * (1 - d / 120)).toFixed(3) + ')'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    }
    for (const p of pts){ ctx.fillStyle = 'rgba(255,124,44,.55)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); }
    if (!reduce) raf = requestAnimationFrame(draw);
  }
  init(); draw();
  window.addEventListener('resize', () => { cancelAnimationFrame(raf); init(); draw(); });
</script>
</body>
